name: app_laundry
description: "Laundryque - Laundry Management App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # ================= UI =================
  flutter_animate: ^4.5.2
  flutter_screenutil: ^5.9.0
  gap: ^3.0.1
  zoom_tap_animation: ^1.1.0

  # ================= STATE =================
  get: ^4.7.2

  # ================= DEVICE =================
  image_picker: ^1.2.0
  permission_handler: ^12.0.1
  url_launcher: ^6.3.1

  shared_preferences: ^2.3.2
  share_plus: ^10.1.4


  # ================= LOCAL DATABASE (BACKEND) =================
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0
  provider: ^6.1.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # ================= DRIFT GENERATOR =================
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/
  # To add assets to your application, add an assets section, like this:
  # assets:
